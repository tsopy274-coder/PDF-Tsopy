<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF-Tsopy | ULTRA CYBER EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Orbitron', sans-serif;
        }

        body {
            background-color: #000;
            color: #00ffcc;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Matrix Canvas Background */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
        }

        /* RGB Neon Border Animation */
        .container {
            position: relative;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 20px;
            padding: 50px;
            width: 90%;
            max-width: 650px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.4);
            z-index: 2;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            border-radius: 22px;
            background: linear-gradient(45deg, #ff0055, #00ffcc, #7928ca, #ff0000, #00ffcc);
            background-size: 400%;
            z-index: -1;
            animation: rgbBorder 5s linear infinite;
        }

        @keyframes rgbBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glitch Title */
        h1 {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 3px 3px #ff0055, -3px -3px #00ffcc;
            animation: glitch 1s infinite alternate;
            margin-bottom: 10px;
        }

        @keyframes glitch {
            0% { text-shadow: 3px 3px #ff0055, -3px -3px #00ffcc; transform: skew(0deg); }
            20% { text-shadow: -3px -3px #ff0055, 3px 3px #00ffcc; transform: skew(-5deg); }
            40% { text-shadow: 3px -3px #ff0055, -3px 3px #00ffcc; transform: skew(5deg); }
            60% { text-shadow: -3px 3px #ff0055, 3px -3px #00ffcc; transform: skew(0deg); }
            100% { text-shadow: 3px 3px #ff0055, -3px -3px #00ffcc; transform: skew(0deg); }
        }

        p {
            color: #a5f3fc;
            font-size: 1.1rem;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        /* Dropzone */
        .dropzone {
            border: 2px dashed #00ffcc;
            border-radius: 12px;
            padding: 35px;
            background: rgba(0, 255, 204, 0.05);
            cursor: pointer;
            transition: 0.3s;
        }

        .dropzone:hover {
            background: rgba(255, 0, 85, 0.15);
            border-color: #ff0055;
            box-shadow: 0 0 30px #ff0055;
            transform: scale(1.02);
        }

        .dropzone i {
            font-size: 4rem;
            color: #00ffcc;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px #00ffcc);
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .dropzone span {
            display: block;
            color: #fff;
            font-size: 1.1rem;
        }

        /* Insane Button */
        .btn-insane {
            margin-top: 30px;
            background: #ff0055;
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055;
            transition: 0.3s;
            letter-spacing: 2px;
        }

        .btn-insane:hover {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 40px #00ffcc, 0 0 80px #00ffcc;
            transform: scale(1.1) rotate(1deg);
        }

        .footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #666;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <!-- Matrix Background Effect -->
    <canvas id="matrix"></canvas>

    <div class="container">
        <h1>PDF-Tsopy</h1>
        <p>[ CYBERNETIC PDF ENGINE ACTIVATED ]</p>

        <div class="dropzone" onclick="alert('SYSTEM READY FOR UPLOAD!')">
            <i class="fa-solid fa-radiation"></i>
            <span>DROP PDF FILE OR <strong>CLICK TO HACK</strong></span>
        </div>

        <button class="btn-insane" onclick="alert('BOOM! 💥')">
            <i class="fa-solid fa-bolt"></i> EXECUTE
        </button>

        <div class="footer">
            TSOPY274 // 2077 EDITION
        </div>
    </div>

    <script>
        // Matrix Rain Script
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*+-/';
        const alphabet = katakana + latin;

        const fontSize = 16;
        const columns = canvas.width / fontSize;

        const rainDrops = [];
        for (let x = 0; x < columns; x++) {
            rainDrops[x] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ffcc';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }

        setInterval(drawMatrix, 30);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
