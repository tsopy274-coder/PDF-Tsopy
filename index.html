<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF-Tsopy | Ultimate Edition</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #030014;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Animated Glowing Background Orbs */
        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #ff007f, #7928ca, #00dfd8);
            filter: blur(100px);
            border-radius: 50%;
            z-index: -1;
            animation: moveOrbs 10s infinite alternate ease-in-out;
        }

        .bg-glow:nth-child(2) {
            top: 60%;
            left: 60%;
            animation-duration: 15s;
            background: linear-gradient(135deg, #007cf0, #00dfd8, #7928ca);
        }

        @keyframes moveOrbs {
            0% { transform: translate(-50px, -50px) scale(1); }
            100% { transform: translate(100px, 100px) scale(1.2); }
        }

        /* Main Container - Glassmorphism */
        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 0 50px rgba(121, 40, 202, 0.3), inset 0 0 20px rgba(255, 255, 255, 0.05);
            text-align: center;
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Header / Title */
        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 15px;
            background: linear-gradient(to right, #00dfd8, #007cf0, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 223, 216, 0.5);
        }

        p {
            color: #a0aec0;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        /* Glowing Upload/Action Box */
        .dropzone {
            border: 2px dashed rgba(0, 223, 216, 0.5);
            border-radius: 16px;
            padding: 40px 20px;
            background: rgba(0, 223, 216, 0.02);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .dropzone:hover {
            border-color: #ff007f;
            background: rgba(255, 0, 127, 0.05);
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.4);
            transform: translateY(-3px);
        }

        .dropzone i {
            font-size: 3.5rem;
            color: #00dfd8;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .dropzone:hover i {
            transform: scale(1.1) rotate(10deg);
            color: #ff007f;
        }

        .dropzone span {
            display: block;
            font-size: 1.2rem;
            font-weight: 500;
        }

        /* Super Glowing Button */
        .btn-glow {
            margin-top: 30px;
            background: linear-gradient(135deg, #7928ca, #ff007f);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.6);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-glow:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.9), 0 0 80px rgba(121, 40, 202, 0.6);
            background: linear-gradient(135deg, #ff007f, #7928ca);
        }

        /* Footer badge */
        .footer-badge {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #718096;
        }

        .footer-badge span {
            color: #00dfd8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Glowing Background Lights -->
    <div class="bg-glow"></div>
    <div class="bg-glow"></div>

    <div class="container">
        <h1>PDF-Tsopy</h1>
        <p>Η πιο φανταχτερή εμπειρία διαχείρισης PDF μόλις ξεκίνησε! 🚀</p>

        <div class="dropzone" onclick="alert('Εδώ μπορείς να βάλεις τη λειτουργία σου!')">
            <i class="fa-solid fa-file-pdf"></i>
            <span>Σύρεε το PDF σου εδώ ή <strong>κάνε κλικ</strong></span>
        </div>

        <button class="btn-glow">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Ξεκίνησε Μαγεία
        </button>

        <div class="footer-badge">
            Powered by <span>Tsopy274</span> & AI ⚡
        </div>
    </div>

</body>
</html>
